title = "Telegram verbinden"
description = "Der Bot-Token von @BotFather. Verlässt den Secret Store nie unverschlüsselt."
submit_label = "Speichern & testen"
# No top-level validate_entry_point here anymore: configure_plugin's
# credential-kind branch (Task 7) only resolves-and-copies an
# already-selected credential's value into `secret_ref` -- it does not also
# call the credential type's own validate_entry_point a second time. That
# entry point now lives on credential_types/telegram_bot.toml instead, run
# when the credential itself is created/tested via <CredentialPicker>, not
# on every setup-form submit. This is a deliberate, accepted behavior change:
# Telegram's setup used to test-on-save every time; now a stale-but-already-
# tested credential can be picked without a fresh re-test at bind time. See
# the migration's task notes for why the simpler version ships first.

[[fields]]
key = "bot_token"
label = "Bot-Token"
kind = "credential"
credential_type = "telegram_bot"
required = true
help = "Von @BotFather per /newbot erhalten, Format 123456:ABC-DEF..."
secret_ref = "telegram/bot_token"

# Read by channels/registry.py's _resolved_config -> ChannelCapabilities.
# Stays at "public" by default -- the same value ChannelCapabilities itself
# defaults to when nothing is configured at all -- so leaving this untouched
# (or re-saving this form without deliberately raising it) never carries more
# than the channel was already cleared for. Raise it here once you actually
# want this chat to carry more than a bare "something is waiting" pointer.
[[fields]]
key = "max_classification"
label = "Höchste erlaubte Vertraulichkeit"
kind = "select"
options = ["public", "internal", "confidential", "restricted"]
default = "public"
required = false
help = "Wie sensibel dürfen Nachrichten sein, die dieser Kanal tatsächlich anzeigt (Approval-Details, Assistant-Antworten)? Bei \"public\" kommt nur ein Hinweis an, dass etwas wartet -- der Inhalt selbst bleibt in oc8."
