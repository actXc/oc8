# Must stay IDENTICAL to tool_pack.toml's own `connections.config` command/args:
# both describe launching the same bridge.
connection_key = "primary"
name = "microsoft365"
command = "python"
args = ["-m", "mcp_bridge"]
department_field = "department"

# Not a secret: a mailbox address is not a credential, so it travels as a plain
# env var the bridge reads (mcp_bridge/_user.py) rather than through the
# secret store.
[env_fields]
MICROSOFT365_DEFAULT_USER = "default_user"
