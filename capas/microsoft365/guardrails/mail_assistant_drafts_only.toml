# Curated use-case library entry (design doc §5) -- the concrete answer to
# "granular per-category activation," reusing the presets' own `only = [...]`
# mechanism. Same documentation-by-example discipline as odoo_mcp's own
# library: every entry says what it grants AND what it deliberately does not.
kind = "library"
key = "mail_assistant_drafts_only"
label = "Mail assistant, drafts only"
summary = "Reads and drafts, but never sends on its own — mail_send and mail_reply are unreachable entirely, not merely approval-gated."
use_case = "mail"
read = true
write = false
send = true
approval_actions = []
approval_eur = ""
only = ["mail_search", "mail_get", "mail_list_folders", "mail_create_draft", "mail_move", "mail_mark_read"]
