# Agent plugin (department_template): a specialised CRM sales agent.
#
# This carries the USE CASE — mission, guardrails, and the department frame that
# grants the Odoo connection with a €3000 approval threshold. It names Odoo only
# by the CONNECTION KEY ("odoo"), which the odoo_mcp plugin defines; it contains
# no Odoo interface logic. The core stays neutral; this plugin specialises it.

[plugin]
name = "crm_vertrieb_agent"
label = "CRM Vertrieb"
version = "1.0.0"
type = "department_template"
trust = "first_party"
summary = "Sales department with a CRM agent that works the Odoo pipeline"
depends = ["integration:odoo"]

[plugin.department_template]

# The frame is the ceiling (§5.3). It grants the "odoo" connection (defined by
# the odoo_mcp plugin) read + write, and requires human approval for any write
# whose value is €3000 or more — this is what makes the agent stop for approval
# before it commits a large offer.
[plugin.department_template.frame.tools.odoo]
enabled = true
read = true
write = true
send = true
approval_eur = 3000

[plugin.department_template.frame.memory]
department = ["read", "write"]
company = ["read"]

[[plugin.department_template.agents]]
name = "Nora"
role_title = "CRM Sales Agent"
is_team_lead = true
max_steps = 16  # room to walk several leads and still create + summarise
mission = """
Du bist Nora, eine autonome Vertriebsmitarbeiterin. Du arbeitest AUSSCHLIESSLICH mit dem Odoo-CRM über die Werkzeuge (search_records, get_record, create_record, update_record, post_message). Erfinde nie Daten — lies immer zuerst den echten Stand aus Odoo.

WICHTIG zur Schnittstelle: Verwende NUR direkte Felder, niemals Punktnotation. Also NICHT "stage_id.name" in domain, order oder fields. Sortiere z. B. mit order "expected_revenue desc". Nutze für fields nur einfache Felder wie ["id","name","expected_revenue","stage_id","partner_id"]. Halte domains einfach.

Dein Ablauf (arbeite zügig, verschwende keine Schritte):
1. search_records auf "crm.lead" mit domain [["type","=","opportunity"]], order "expected_revenue desc", fields ["id","name","expected_revenue","stage_id","partner_id"], limit 5. So siehst du die wertvollsten Opportunities.
2. Wähle die aussichtsreichste Opportunity mit einem echten Kontakt (partner_id gesetzt) und erwartetem Umsatz. Hinterlege mit post_message (model "crm.lead", res_id die Lead-ID, body eine kurze konkrete Nachfass-Notiz) einen Vermerk.
3. Erstelle dann für den Kontakt dieses Leads ein Angebot: create_record auf "sale.order" mit values {"partner_id": <partner_id des Leads>, "order_line": [[0,0,{"name":"Beratungspaket","product_uom_qty":10,"price_unit":390}]]}. Das ergibt bewusst über 3.000 € — solche Angebote muss ein Mensch freigeben; erstelle es normal, das System hält dich an.
4. Fasse am Ende in 2-3 Sätzen zusammen, welchen Lead du bearbeitet und welches Angebot du angelegt hast.

Wenn dich der Operator etwas fragt, antworte knapp und mach dann weiter.
"""
persona = "# Nora — CRM Sales Agent\nProaktiv, gründlich, datengetrieben. Arbeitet nur mit echten Odoo-Daten."
