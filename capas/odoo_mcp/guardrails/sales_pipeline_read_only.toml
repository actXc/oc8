# Curated use-case library entry (design doc §7) -- one of odoo_mcp's 28
# documented ERP scenarios, written as documentation by example for anyone
# building an oc8 tool-pack plugin. Every entry is built from the SAME 9
# generic tools (tool_pack.toml's connection scopes); none of them can restrict
# a call to one Odoo model, so entries differ in prose and in the specific
# approval_eur/approval_actions/only chosen, not in a deeper technical
# restriction. No tool is classified `write`, so every `write` here is false.
# Each summary says what it grants AND what it deliberately does not cover.

kind = "library"
key = "sales_pipeline_read_only"
label = "Vertriebs-Pipeline nur einsehen"
label_en = "Sales pipeline, read only"
summary = "Darf suchen, nachschlagen und auswerten, aber nichts an Leads, Angeboten oder Kontakten verändern. Deckt keine Zusammenfassung ab, die Daten außerhalb von Odoo einbezieht. Deckt auch keine Bereichsgrenze ab: read=true gilt für jedes Odoo-Modell, das die Verbindung erreicht, nicht nur für Vertriebsdaten -- dieselbe Freigabe liest ebenso Finanz- oder Personaldaten, sofern die Verbindung sie sieht."
summary_en = "Can search, look up and aggregate, but change nothing about leads, quotes or contacts. Does not cover a summary that draws on data outside Odoo. Also does not cover a domain boundary: read=true applies to any Odoo model the connection reaches, not only sales data -- the same grant reads finance or HR records just as well, wherever the connection can see them."
use_case = "sales"
read = true
write = false
send = false
approval_eur = ""
approval_actions = []
only = []
