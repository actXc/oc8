# Curated use-case library entry (design doc §7) -- one of odoo_mcp's 28
# documented ERP scenarios, written as documentation by example for anyone
# building an oc8 tool-pack plugin. Every entry is built from the SAME 9
# generic tools (tool_pack.toml's connection scopes); none of them can restrict
# a call to one Odoo model, so entries differ in prose and in the specific
# approval_eur/approval_actions/only chosen, not in a deeper technical
# restriction. No tool is classified `write`, so every `write` here is false.
# Each summary says what it grants AND what it deliberately does not cover.

kind = "library"
key = "sales_autonomous_with_limit"
label = "Selbstständig im Vertrieb mit Limit, kein Löschen"
label_en = "Autonomous in sales with a limit, no deleting"
summary = "Legt Angebote und Kontakte selbstständig an und bearbeitet sie; ab dem eingestellten Betrag entscheidet ein Mensch. Löschen ist ausgeschlossen, weil ein Betrags-Schwellenwert eine Löschung -- die keinen Betrag trägt -- niemals erreichen würde."
summary_en = "Creates and edits quotes and contacts on its own; at or above the configured amount a human decides. Deleting is excluded, because a euro threshold can never catch a deletion, which carries no amount."
use_case = "sales"
read = true
write = false
send = true
approval_eur = 1000
approval_actions = []
only = ["search_records", "get_record", "list_models", "list_resource_templates", "aggregate_records", "create_record", "update_record", "post_message"]

[[adjustable]]
field = "approval_eur"
label = "Freigabe ab"
label_en = "Approval from"
unit = "EUR"
min = 0
max = 20000
