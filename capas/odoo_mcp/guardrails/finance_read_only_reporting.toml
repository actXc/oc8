# Curated use-case library entry (design doc §7) -- one of odoo_mcp's 28
# documented ERP scenarios, written as documentation by example for anyone
# building an oc8 tool-pack plugin. Every entry is built from the SAME 9
# generic tools (tool_pack.toml's connection scopes); none of them can restrict
# a call to one Odoo model, so entries differ in prose and in the specific
# approval_eur/approval_actions/only chosen, not in a deeper technical
# restriction. No tool is classified `write`, so every `write` here is false.
# Each summary says what it grants AND what it deliberately does not cover.

kind = "library"
key = "finance_read_only_reporting"
label = "Finanzberichte, nur lesen"
label_en = "Financial reporting, read only"
summary = "Darf Rechnungen suchen, nachschlagen und auswerten, aber nichts anlegen, ändern oder senden. Deckt keine Berichte ab, die Daten außerhalb von Odoo zusammenführen. Deckt auch keine Bereichsgrenze ab: read=true gilt für jedes Odoo-Modell, das die Verbindung erreicht, nicht nur für Finanzdaten."
summary_en = "Can search, look up and aggregate invoices, but create, change or send nothing. Does not cover reports that combine data from outside Odoo. Also does not cover a domain boundary: read=true applies to any Odoo model the connection reaches, not only financial data."
use_case = "finance"
read = true
write = false
send = false
approval_eur = ""
approval_actions = []
only = []
