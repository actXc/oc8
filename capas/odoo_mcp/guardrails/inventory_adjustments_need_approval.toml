# Curated use-case library entry (design doc §7) -- one of odoo_mcp's 28
# documented ERP scenarios, written as documentation by example for anyone
# building an oc8 tool-pack plugin. Every entry is built from the SAME 9
# generic tools (tool_pack.toml's connection scopes); none of them can restrict
# a call to one Odoo model, so entries differ in prose and in the specific
# approval_eur/approval_actions/only chosen, not in a deeper technical
# restriction. No tool is classified `write`, so every `write` here is false.
# Each summary says what it grants AND what it deliberately does not cover.

kind = "library"
key = "inventory_adjustments_need_approval"
label = "Stock adjustments need approval"
summary = "Every new, changed or deleted inventory record needs approval. Does not cover a tolerance band -- unlike a euro amount, there is no recognised quantity threshold here, so every adjustment needs the same approval regardless of size. Does not cover post_message -- a shipping notification or other message to a person stays ungated, because this guardrail is scoped to stock changes, not customer contact."
use_case = "inventory"
read = true
modify = true
approval_eur = ""
approval_actions = ["create_record", "update_record", "delete_record"]
only = []
