# Curated use-case library entry (design doc §7) -- one of odoo_mcp's 28
# documented ERP scenarios, written as documentation by example for anyone
# building an oc8 tool-pack plugin. Every entry is built from the SAME 9
# generic tools (tool_pack.toml's connection scopes); none of them can restrict
# a call to one Odoo model, so entries differ in prose and in the specific
# approval_eur/approval_actions/only chosen, not in a deeper technical
# restriction. No tool is classified `write`, so every `write` here is false.
# Each summary says what it grants AND what it deliberately does not cover.

kind = "library"
key = "finance_invoice_approval_threshold"
label = "Rechnungsentwürfe bis zu einem Betrag automatisch, kein Löschen"
label_en = "Invoice drafts up to an amount automatically, no deleting"
summary = "Legt Rechnungsentwürfe selbstständig an und pflegt sie; ab dem eingestellten Betrag entscheidet ein Mensch, Löschen ist ausgeschlossen. Deckt nicht ab, ob eine Rechnung tatsächlich gebucht (posted) wird -- das Werkzeug-Set unterscheidet eine Buchung nicht von jeder anderen Aktualisierung."
summary_en = "Creates and maintains invoice drafts on its own; at or above the configured amount a human decides, and deleting is excluded. Does not cover whether an invoice actually gets posted -- this tool set cannot tell a posting apart from any other update."
use_case = "finance"
read = true
write = false
send = true
approval_eur = 1000
approval_actions = []
only = ["search_records", "get_record", "list_models", "list_resource_templates", "aggregate_records", "create_record", "update_record", "post_message"]

[[adjustable]]
field = "approval_eur"
label = "Freigabe ab"
label_en = "Approval from"
unit = "EUR"
min = 0
max = 100000
