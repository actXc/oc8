# Curated use-case library entry (design doc §7) -- one of odoo_mcp's 28
# documented ERP scenarios, written as documentation by example for anyone
# building an oc8 tool-pack plugin. Every entry is built from the SAME 9
# generic tools (tool_pack.toml's connection scopes); none of them can restrict
# a call to one Odoo model, so entries differ in prose and in the specific
# approval_eur/approval_actions/only chosen, not in a deeper technical
# restriction. No tool is classified `write`, so every `write` here is false.
# Each summary says what it grants AND what it deliberately does not cover.

kind = "library"
key = "helpdesk_read_only_reporting"
label = "Ticket-Auswertung, nur lesen"
label_en = "Ticket reporting, read only"
summary = "Darf Tickets suchen und auswerten, aber nichts verändern oder senden. Deckt keine Trendanalyse über mehrere Perioden ab -- es gibt keine Aggregation über das hinaus, was das Werkzeug selbst liefert. Deckt auch keine Bereichsgrenze ab: read=true gilt für jedes Odoo-Modell, das die Verbindung erreicht, nicht nur für Tickets."
summary_en = "Can search and aggregate tickets, but change or send nothing. Does not cover trend analysis across periods -- there is no aggregation beyond what the tool itself returns. Also does not cover a domain boundary: read=true applies to any Odoo model the connection reaches, not only tickets."
use_case = "helpdesk"
read = true
write = false
send = false
approval_eur = ""
approval_actions = []
only = []
