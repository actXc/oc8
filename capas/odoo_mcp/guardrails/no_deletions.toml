# Guardrail preset (§4 of the design doc): one of the five answers an operator
# actually has, so the wizard stops asking a sales question of every agent.
kind = "preset"
connection = "primary"
key = "no_deletions"
label = "Mit Freigabe, ohne Löschen"
label_en = "With approval, never deletes"
summary = "Wie \"Unterstützen mit Freigabe\", aber Löschen ist gar nicht erst möglich."
summary_en = "Like \"Assist with approval\", except deleting is not possible at all."
recommended = false
read = true
write = false
send = true
approval_actions = ["send"]
approval_eur = ""
# The difference from `assist_with_approval` is "never" versus "only with a
# human": there, a deletion is merely held for approval and somebody can wave
# it through at four in the afternoon. Here the tool is not on the table.
only = [
  "search_records", "get_record", "list_models", "list_resource_templates",
  "aggregate_records", "create_record", "update_record", "post_message",
]
