# Curated use-case library entry (design doc §7) -- one of odoo_mcp's 28
# documented ERP scenarios, written as documentation by example for anyone
# building an oc8 tool-pack plugin. Every entry is built from the SAME 9
# generic tools (tool_pack.toml's connection scopes); none of them can restrict
# a call to one Odoo model, so entries differ in prose and in the specific
# approval_eur/approval_actions/only chosen, not in a deeper technical
# restriction. No tool is classified `write`, so every `write` here is false.
# Each summary says what it grants AND what it deliberately does not cover.

kind = "library"
key = "helpdesk_no_deletions"
label = "Tickets bearbeiten, nie löschen"
label_en = "Work tickets, never delete"
summary = "Darf Tickets anlegen, bearbeiten und beantworten; delete_record steht nicht zur Verfügung. Deckt nicht ab, dass ein Ticket per Update de facto stillgelegt wird (z. B. auf eine Papierkorb-Stufe gesetzt) -- das bleibt ohne Freigabe möglich. Deckt auch keine Bereichsgrenze ab: das Ausschließen von delete_record gilt für jedes Odoo-Modell, das die Verbindung erreicht, nicht nur für Tickets."
summary_en = "Can create, update and reply to tickets; delete_record is withheld. Does not cover a ticket being effectively retired through an update (e.g. set to a trash-like stage) -- that remains possible without approval. Also does not cover a domain boundary: excluding delete_record applies to any Odoo model the connection reaches, not only tickets."
use_case = "helpdesk"
read = true
write = false
send = true
approval_eur = ""
approval_actions = []
only = ["search_records", "get_record", "list_models", "list_resource_templates", "aggregate_records", "create_record", "update_record", "post_message"]
