# Curated use-case library entry (design doc §7) -- one of odoo_mcp's 28
# documented ERP scenarios, written as documentation by example for anyone
# building an oc8 tool-pack plugin. Every entry is built from the SAME 9
# generic tools (tool_pack.toml's connection scopes); none of them can restrict
# a call to one Odoo model, so entries differ in prose and in the specific
# approval_eur/approval_actions/only chosen, not in a deeper technical
# restriction. No tool is classified `write`, so every `write` here is false.
# Each summary says what it grants AND what it deliberately does not cover.

kind = "library"
key = "cross_internal_only_never_customer_facing"
label = "Nur intern, nie kundenseitig"
label_en = "Internal only, never customer-facing"
summary = "Legt Datensätze in beliebigen Odoo-Modellen an und pflegt sie, aber post_message und delete_record stehen nicht zur Verfügung -- unabhängig davon, ob der Datensatz tatsächlich mit einer Kundin oder einem Kunden zu tun hat. Deckt nicht ab, ob ein Feld auf dem Datensatz selbst indirekt einer Person angezeigt wird, etwa über ein Kundenportal."
summary_en = "Creates and maintains records on any Odoo model, but post_message and delete_record are withheld -- regardless of whether the record actually concerns a customer. Does not cover a field on the record itself indirectly being shown to a person, e.g. through a customer portal."
use_case = "cross_cutting"
read = true
write = false
send = true
approval_eur = ""
approval_actions = []
only = ["search_records", "get_record", "list_models", "list_resource_templates", "aggregate_records", "create_record", "update_record"]
