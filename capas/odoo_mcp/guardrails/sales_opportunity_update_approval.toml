# Curated use-case library entry (design doc §7) -- one of odoo_mcp's 28
# documented ERP scenarios, written as documentation by example for anyone
# building an oc8 tool-pack plugin. Every entry is built from the SAME 9
# generic tools (tool_pack.toml's connection scopes); none of them can restrict
# a call to one Odoo model, so entries differ in prose and in the specific
# approval_eur/approval_actions/only chosen, not in a deeper technical
# restriction. No tool is classified `write`, so every `write` here is false.
# Each summary says what it grants AND what it deliberately does not cover.

kind = "library"
key = "sales_opportunity_update_approval"
label = "Änderungen an werthaltigen Opportunities freigeben"
label_en = "Approve changes to high-value opportunities"
summary = "Bearbeitet Opportunities selbstständig; ab dem eingestellten Betrag entscheidet ein Mensch. Erkennt das Schließen einer Opportunity nicht gezielt -- jede Änderung am Datensatz ab diesem Betrag braucht die Freigabe, nicht nur das Setzen auf 'gewonnen'."
summary_en = "Updates opportunities on its own; at or above the configured amount a human decides. Does not specifically detect closing an opportunity -- any change to the record at or above the amount needs approval, not only setting it to 'won'."
use_case = "sales"
read = true
write = false
send = true
approval_eur = 5000
approval_actions = []
only = ["search_records", "get_record", "list_models", "list_resource_templates", "aggregate_records", "create_record", "update_record", "post_message"]

[[adjustable]]
field = "approval_eur"
label = "Freigabe ab"
label_en = "Approval from"
unit = "EUR"
min = 0
max = 100000
