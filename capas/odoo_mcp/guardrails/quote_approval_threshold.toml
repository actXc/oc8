# Curated use-case library entry (design doc §7) -- one of odoo_mcp's 28
# documented ERP scenarios, written as documentation by example for anyone
# building an oc8 tool-pack plugin. Every entry is built from the SAME 9
# generic tools (tool_pack.toml's connection scopes); none of them can restrict
# a call to one Odoo model, so entries differ in prose and in the specific
# approval_eur/approval_actions/only chosen, not in a deeper technical
# restriction. No tool is classified `write`, so every `write` here is false.
# Each summary says what it grants AND what it deliberately does not cover.

kind = "library"
key = "quote_approval_threshold"
label = "Approve quotes above an amount"
summary = "Creates and maintains quotes on its own; at or above the configured amount a human decides. Does not cover whether a quote actually gets marked won -- no tool distinguishes that one field change from any other update. More importantly: `only` is deliberately left empty here, matching this file's own worked example (design §4) -- so delete_record and post_message stay reachable ungated, and a deletion carries no amount the threshold could ever catch. `sales_autonomous_with_limit` is the version that closes this gap -- same threshold idea, with delete_record excluded."
use_case = "sales"
read = true
write = false
send = true
approval_eur = 3000
approval_actions = []
only = []

[[adjustable]]
field = "approval_eur"
label = "Approval from"
unit = "EUR"
min = 0
max = 50000
