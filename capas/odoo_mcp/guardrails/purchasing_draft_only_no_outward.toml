# Curated use-case library entry (design doc §7) -- one of odoo_mcp's 28
# documented ERP scenarios, written as documentation by example for anyone
# building an oc8 tool-pack plugin. Every entry is built from the SAME 9
# generic tools (tool_pack.toml's connection scopes); none of them can restrict
# a call to one Odoo model, so entries differ in prose and in the specific
# approval_eur/approval_actions/only chosen, not in a deeper technical
# restriction. No tool is classified `write`, so every `write` here is false.
# Each summary says what it grants AND what it deliberately does not cover.

kind = "library"
key = "purchasing_draft_only_no_outward"
label = "Draft requisitions, never contact suppliers directly"
summary = "Creates and maintains requisitions and orders, but post_message and delete_record are withheld. Does not cover an order being emailed as an attachment from outside Odoo. Also does not cover a domain boundary: the same rule applies to any Odoo model the connection reaches, not only purchasing."
use_case = "purchasing"
read = true
modify = true
approval_eur = ""
approval_actions = []
only = ["search_records", "get_record", "list_models", "list_resource_templates", "aggregate_records", "create_record", "update_record"]
