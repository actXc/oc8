name = "Phase 1: Requirements Translation"
category = "engineering"
description = "Procedure for phase 1: requirements translation in the Prompt Engineer role."
instruction = """
Execute the procedure for: Phase 1: Requirements Translation.
Use available tools/knowledge; list missing inputs instead of inventing data.

1. Ask: "What is the exact output format?" — get JSON schema, Markdown template, or prose spec.
2. Ask: "What are the 3 most common inputs?" — these become your positive few-shot examples.
3. Ask: "What inputs should the model refuse or redirect?" — defines your guardrails.
4. Document all of this in a prompt_spec.md before writing a single line of prompt.

Finish with a short status: done / blocked, evidence used, and the next human action if any.
"""
guardrails = [
  "Never invent facts, metrics, or source material.",
  "Escalate irreversible or high-impact actions for human approval when governance requires it.",
  "One focused deliverable per run unless the task says otherwise.",
]
