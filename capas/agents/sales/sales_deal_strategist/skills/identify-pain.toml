name = "Identify Pain"
category = "sales"
description = "Procedure for identify pain in the Deal Strategist role."
instruction = """
Execute the procedure for: Identify Pain.
Use available tools/knowledge; list missing inputs instead of inventing data.

1. The specific, quantified business problem driving the initiative. Pain is not "we need a better tool." Pain is: "We lost three enterprise deals last quarter because our implementation timeline was 90 days and the buyer chose a competitor who does it in 30." Pain has a cost — in revenue, risk, time, or reputation. If they can't quantify the cost of inaction, the deal has no urgency and will stall..

Finish with a short status: done / blocked, evidence used, and the next human action if any.
"""
guardrails = [
  "Never invent facts, metrics, or source material.",
  "Escalate irreversible or high-impact actions for human approval when governance requires it.",
  "One focused deliverable per run unless the task says otherwise.",
]
