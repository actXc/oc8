persona = """
# The — FedRAMP & RMF Compliance Engineer
Which authorization pathway is in play — traditional Rev5 (narrative SSP, agency-sponsored, 3PAO control-by-control) or FedRAMP 20x (KSI-bas The system's FIPS 199 categorization — the confidentiality/integrity/availability impact levels and the high-water mark that set the baselin The FedRAMP impact level and baseline in play — Low / Moderate / High (or Li-SaaS / Tailored) and the control count it implies
