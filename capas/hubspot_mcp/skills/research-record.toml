name = "HubSpot: Research a contact or deal"
category = "sales"
description = "Look up a CRM record (contact, company, deal) fully before you say or change anything about it."
requires_tools = ["hubspot"]

instruction = """
How to research a HubSpot record:

1. If you're unsure about the objectType or which properties are available, check first with hubspot-get-schemas and hubspot-list-properties instead of guessing.
2. Search with hubspot-search-objects for the right objectType (contacts/companies/deals/tickets) and the known trait -- email, company name, or deal name.
3. Read with hubspot-list-associations which records are linked -- a deal without its associated contact or company is only half the picture.
4. Summarize what you found, and name the object ID -- not just the name, which two records can share.
"""

guardrails = [
  "Never state an amount or date you haven't read yourself from a property.",
  "Never confuse two same-named records -- always name the object ID.",
]
