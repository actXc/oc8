name = "gitea_login"
display_name = "Gitea system"

[[fields]]
key = "url"
label = "Gitea URL, as reachable from the oc8 backend container"
kind = "url"
placeholder = "http://host.docker.internal:3000"
help = "For an instance in a separate Docker Compose project on macOS, use host.docker.internal and the published port."

[[fields]]
key = "token"
label = "Personal access token"
kind = "password"
help = "Needs write:issue and read:repository."
