# LLM provider plugin: OpenRouter (https://openrouter.ai), a single well-known
# OpenAI-compatible endpoint aggregating many model providers behind one BYOK
# key. Adding a provider is a PLUGIN concern, not a core edit -- the core model
# router resolves plugin-contributed providers exactly like built-in ones, and
# a tenant may only use one it enabled. The API key is never in this manifest;
# it is a BYOK tenant `Credential` of this plugin's own `openrouter_api_key`
# type (credential_types/openrouter_api_key.toml) -- the same unified
# credentials framework a core provider's `{canonical}_api_key` type goes
# through.

[plugin]
name = "openrouter_provider"
version = "1.0.0"
type = "model_adapter"
trust = "first_party"
summary = "OpenRouter — one BYOK key, many model providers, over an OpenAI-compatible endpoint"
# The official OpenRouter mark. Served by GET /plugins/{id}/icon.
icon = "openrouter-color.svg"

[plugin.entry_points]
providers = "provider.provider:register"
