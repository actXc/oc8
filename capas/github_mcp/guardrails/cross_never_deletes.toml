kind = "library"
key = "cross_never_deletes"
label = "Never deletes (cross-department)"
summary = "A cross-department safety net rather than a specific scenario: everything except delete_file stays usable autonomously, with no approval. There is no repository-deletion tool in this bridge -- delete_file (removing one file) is the only destructive call it exposes, and this guardrail is the one place that always withholds it, independent of whatever other guardrail also applies."
use_case = "cross-department"
read = true
modify = true
approval_eur = ""
approval_actions = []
# `only` names every reachable tool, read and modify alike (`pdp.py`'s
# `in_surface` applies it uniformly) -- so this list has to repeat the
# connection's full `read` scope too, not just which modify tools stay
# reachable, or every read tool would go unreachable as a side effect of a
# guardrail that only ever meant to withhold one delete call.
only = [
    "get_me", "get_team_members", "get_teams", "get_label", "issue_read",
    "list_issue_fields", "list_issue_types", "list_issues", "search_issues",
    "list_pull_requests", "pull_request_read", "search_pull_requests",
    "get_commit", "get_file_contents", "get_latest_release", "get_release_by_tag",
    "get_tag", "list_branches", "list_commits", "list_releases",
    "list_repository_collaborators", "list_tags", "search_code", "search_commits",
    "search_repositories", "search_users",
    "add_issue_comment", "issue_write", "sub_issue_write",
    "add_comment_to_pending_review", "add_reply_to_pull_request_comment",
    "create_pull_request", "merge_pull_request", "pull_request_review_write",
    "update_pull_request", "update_pull_request_branch", "create_branch",
    "create_or_update_file", "create_repository", "fork_repository", "push_files",
]
