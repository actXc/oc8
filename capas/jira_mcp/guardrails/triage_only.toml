    "jira_update_issue", "jira_assign_issue", "jira_move_issue",
    "jira_add_comment", "jira_edit_comment", "jira_transition_issue",
    "jira_link_to_epic", "jira_create_issue_link", "jira_remove_issue_link",
    "jira_add_worklog", "jira_add_watcher", "jira_remove_watcher",
