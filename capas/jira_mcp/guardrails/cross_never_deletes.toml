kind = "library"
key = "cross_never_deletes"
label = "Never deletes (cross-department)"
summary = "A cross-department safety net rather than a specific scenario: everything except jira_delete_issue stays usable autonomously, with no approval. For a team that treats deletion as categorically irreversible -- a ticket can be closed but never removed -- independent of whatever other guardrail also applies."
