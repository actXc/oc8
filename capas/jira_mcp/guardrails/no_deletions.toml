kind = "preset"
connection = "primary"
key = "no_deletions"
label = "With approval, never deletes"
summary = "Like \"Assist with approval\", except deleting is not possible at all."
recommended = false
read = true
modify = true
approval_actions = ["modify"]
approval_eur = ""
# The difference from `assist_with_approval` is "never" versus "only with a
# human": there, a deletion is merely held for approval and somebody can wave
# it through at four in the afternoon. Here the tool is not on the table.
only = [
    "jira_create_issue", "jira_batch_create_issues", "jira_update_issue",
    "jira_assign_issue", "jira_move_issue", "jira_add_comment", "jira_edit_comment",
    "jira_transition_issue", "jira_link_to_epic", "jira_create_issue_link",
    "jira_remove_issue_link", "jira_add_worklog", "jira_add_watcher",
    "jira_remove_watcher", "jira_create_sprint", "jira_update_sprint",
    "jira_add_issues_to_sprint",
]
