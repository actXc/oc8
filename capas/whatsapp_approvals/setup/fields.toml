title = "WhatsApp verbinden"
description = "Cloud-API-Zugriffstoken und die Sende-Rufnummer aus dem Meta Business-Konto."
submit_label = "Speichern & testen"
# No top-level validate_entry_point here anymore -- moved to
# credential_types/whatsapp_api.toml (mirrors telegram_approvals' e5a379a8
# migration). configure_plugin's credential-kind branch only resolves and
# copies an already-selected credential's fields; it does not call the
# credential type's own validate_entry_point a second time at setup submit.

[[fields]]
key = "access_token"
label = "Cloud-API-Zugriffstoken"
kind = "credential"
credential_type = "whatsapp_api"
required = true
help = "Aus dem Meta Business-Konto, App > WhatsApp > API-Setup."
secret_ref = "whatsapp/access_token"
