{{- if and .Values.ingress.enabled (not .Values.caddy.enabled) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "oc8.fullname" . }}
  labels:
    {{- include "oc8.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "oc8.backendHost" $ }}
                port:
                  number: 8099
          - path: /health
            pathType: Exact
            backend:
              service:
                name: {{ include "oc8.backendHost" $ }}
                port:
                  number: 8099
          - path: /llm
            pathType: Prefix
            backend:
              service:
                name: {{ include "oc8.backendHost" $ }}
                port:
                  number: 8099
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: {{ include "oc8.backendHost" $ }}
                port:
                  number: 8099
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "oc8.frontendHost" $ }}
                port:
                  number: 3000
          {{- end }}
    {{- end }}
{{- end }}
