apiVersion: v1
kind: Service
metadata:
  name: {{ include "oc8.backendHost" . }}
  labels:
    {{- include "oc8.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8099
      targetPort: http
  selector:
    {{- include "oc8.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "oc8.fullname" . }}-backend
  labels:
    {{- include "oc8.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      {{- include "oc8.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "oc8.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "oc8.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "oc8.waitForPostgresInit" . | nindent 8 }}
        {{- include "oc8.migrateInit" . | nindent 8 }}
      containers:
        - name: backend
          image: {{ include "oc8.backendImage" . }}
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          ports:
            - name: http
              containerPort: 8099
          env:
            {{- include "oc8.backendEnv" . | nindent 12 }}
          volumeMounts:
            {{- include "oc8.backendVolumeMounts" . | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          {{- with .Values.backend.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        {{- if .Values.backend.containerSocket.enabled }}
        - name: container-socket
          hostPath:
            path: {{ .Values.backend.containerSocket.hostPath }}
            type: Socket
        {{- end }}
        {{- $vols := include "oc8.backendVolumes" . }}
        {{- if $vols }}
        {{- $vols | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
